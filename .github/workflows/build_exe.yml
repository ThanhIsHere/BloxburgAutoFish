name: Build Standalone BloxburgAutoFish EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build single-file executable into /dist
        run: |
          pyinstaller --clean --noconfirm BloxburgAutoFish.spec

      - name: Upload BloxburgAutoFish.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloxburgAutoFish-Windows-x64
          path: dist/BloxburgAutoFish.exe
